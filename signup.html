<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup | Online Quiz System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body signup-page">
  <section class="auth-hero">
    <span class="hero-kicker">Smart Quiz Studio</span>
    <h1>Online Quiz System</h1>
    <p>Create your space for practice, progress, and quick results.</p>
  </section>
  <main class="auth-box">
    <h1>Create Account</h1>
    <input id="fullName" type="text" placeholder="Full Name" autocomplete="name" required tabindex="1">
    <input id="username" type="text" placeholder="Username" autocomplete="username" required tabindex="2">
    <div class="password-field">
      <input id="password" type="password" placeholder="Password" autocomplete="new-password" required tabindex="3">
      <button type="button" class="show-password-btn" onclick="togglePasswordVisibility('password', this)" tabindex="4">Show</button>
    </div>
    <div class="password-field">
      <input id="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password" required tabindex="5">
      <button type="button" class="show-password-btn" onclick="togglePasswordVisibility('confirmPassword', this)" tabindex="6">Show</button>
    </div>
    <button type="button" onclick="signup()" tabindex="7">Signup</button>
    <p><a href="index.html">Already have an account?</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
